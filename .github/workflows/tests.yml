name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Pine static checks (declaration order, scopes, typos)
        run: python tradingview/check_pine.py
      - name: strategy file is up to date
        run: |
          python tradingview/build_strategy.py
          git diff --exit-code tradingview/SMC_ICT_Pro_Strategy.pine
